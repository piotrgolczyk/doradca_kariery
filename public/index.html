<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doradca kariery</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Doradca kariery (Emma)</h1>
        <button id="loadFull" hidden>Wczytaj całość rozmowy</button>
      </header>

      <section id="chat" class="chat"></section>

      <form id="chatForm" class="chat-form">
        <input id="messageInput" placeholder="Napisz wiadomość..." autocomplete="off" />
        <button type="submit">Wyślij</button>
      </form>

      <aside class="bottom-panel">
        <h2>Postęp sekcji</h2>
        <ul id="sections"></ul>
        <div class="prompt-row">
          <span>Aktualny prompt</span>
          <button id="copyPrompt" title="Kopiuj prompt">📋</button>
        </div>
        <pre id="promptView"></pre>
      </aside>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
